name: Keep alive

# Planos gratuitos: o Render hiberna a API após ~15 min sem requisições e o Supabase pausa o
# projeto após ~1 semana sem atividade. O /health da API faz um SELECT 1 no banco, então um
# único ping mantém os dois acordados.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (API + banco)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Defina a variável de repositório API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # Se a API estiver dormindo, a primeira resposta leva ~1 min: aguarda e tenta de novo.
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            "${API_URL%/}/health"
          echo
